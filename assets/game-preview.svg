<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071a2f"/>
    <stop offset=".55" stop-color="#0b4a7a"/>
    <stop offset="1" stop-color="#081426"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f2f50"/>
    <stop offset="1" stop-color="#08182a"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="520" rx="34" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2"/>
<rect x="28" y="28" width="1144" height="464" rx="26" fill="url(#bg)"/>
<text x="58" y="72" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#e0f2fe">🎮 RAVS DEV GAME LAB</text>
<text x="960" y="72" font-family="monospace" font-size="22" font-weight="700" fill="#bae6fd">SCORE 0300</text>

<circle cx="92" cy="120" r="32" fill="#38bdf8" fill-opacity=".15"/>
<circle cx="180" cy="104" r="42" fill="#7dd3fc" fill-opacity=".12"/>
<circle cx="1075" cy="140" r="54" fill="#38bdf8" fill-opacity=".12"/>

<path d="M0 330 Q110 240 220 325 T440 318 T660 330 T880 320 T1200 300 V520 H0Z" fill="#0b2d4d"/>
<path d="M0 380 Q140 300 280 372 T560 360 T840 375 T1200 350 V520 H0Z" fill="#0a223a"/>

<!-- ground -->
<rect x="58" y="400" width="1084" height="42" rx="8" fill="#163a5d"/>
<rect x="58" y="400" width="1084" height="6" fill="#38bdf8"/>

<!-- platforms -->
<rect x="310" y="336" width="160" height="26" rx="5" fill="#163a5d"/>
<rect x="310" y="336" width="160" height="5" fill="#38bdf8"/>
<rect x="590" y="288" width="170" height="26" rx="5" fill="#163a5d"/>
<rect x="590" y="288" width="170" height="5" fill="#38bdf8"/>
<rect x="865" y="235" width="150" height="26" rx="5" fill="#163a5d"/>
<rect x="865" y="235" width="150" height="5" fill="#38bdf8"/>

<!-- player -->
<g transform="translate(132 338)">
  <rect x="0" y="0" width="44" height="58" rx="8" fill="#f8fafc"/>
  <rect x="6" y="10" width="32" height="20" rx="5" fill="#38bdf8"/>
  <rect x="10" y="15" width="6" height="6" fill="#020617"/>
  <rect x="28" y="15" width="6" height="6" fill="#020617"/>
  <rect x="9" y="58" width="10" height="12" fill="#0f172a"/>
  <rect x="25" y="58" width="10" height="12" fill="#0f172a"/>
</g>

<!-- coins -->
<g filter="url(#glow)" fill="#facc15" stroke="#fde68a" stroke-width="3">
  <circle cx="390" cy="305" r="16"/>
  <circle cx="675" cy="255" r="16"/>
  <circle cx="940" cy="200" r="16"/>
</g>

<!-- portal -->
<g filter="url(#glow)">
  <rect x="1058" y="310" width="46" height="90" rx="20" fill="none" stroke="#67e8f9" stroke-width="7"/>
  <rect x="1069" y="325" width="24" height="60" rx="12" fill="#22d3ee" fill-opacity=".18"/>
</g>

<text x="58" y="470" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93c5fd">A/D or ←/→ Move   •   W / ↑ / Space Jump   •   Collect coins   •   Reach the portal</text>
</svg>