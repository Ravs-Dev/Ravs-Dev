<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravs Dev Game Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<section class="panel">
<div class="topbar"><div><span class="dot"></span>RAVS DEV GAME LAB</div><div id="score">SCORE 0000</div></div>
<canvas id="game" width="960" height="480"></canvas>

</div>
<p class="note">Collect all coins and reach the glowing portal.</p>
</section>
</main>
<script src="game.js"></script>
</body>
